status:
  scope: >-
    The formalization is complete. It covers the discrete randomly oriented
    Manhattan model, countable Fourier--Walsh coordinates, Fourier transform
    in position, the fixed-frequency variational upper bound, the explicit
    degree-one and degree-three estimates, the concrete competitor and the
    four-sector objective, and both main theorems. The manifest has 76
    records, every one in state PROVED and none registered as a draft; three
    proved predecessors are retired from the live import cone. Manhattan/
    contains no sorry, and Theorem 1.1, Theorem 1.2 and Proposition 2.2 all
    depend on exactly [propext, Classical.choice, Quot.sound]. The repository
    contains no sorry.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - declaration: "Manhattan.Frozen.Main.theorem_1_1"
      file: "Manhattan/Frozen/Main/Theorem11.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"
      literature_dependencies: []
      note: >-
        Theorem 1.1; proved by Manhattan.Glue.theorem_1_1_proved_of_exists from
        Manhattan.Glue.exists_concreteSectorEnergyBound.
    - declaration: "Manhattan.Frozen.Main.theorem_1_2"
      file: "Manhattan/Frozen/Main/Theorem12.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"
      literature_dependencies: []
      note: >-
        Theorem 1.2; proved by Manhattan.Glue.theorem_1_2_proved_of_exists.

automation:
  methods:
    - method: "agent"
      models: []
      framework: "Codex agentic coding harness"
      tool_setup: >-
        Lake builds under Lean v4.26.0 with Mathlib v4.26.0 as the only
        dependency. Public declarations use a content-hashed frozen-statement
        manifest and the main results require an independent Mathlib-only
        comparator audit.
      cost:
        wall_time: ""
        accounts: ""
        spend_usd: ""
        hardware: ""
      prompting_notes: >-
        Human-directed parallel development with statement-level decisions recorded
        before integration.
  spend_usd: ""
  notes: >-
    Invariants are no unregistered sorry, no sorry in definitions or support,
    no custom axiom, and no warnings outside the exact registered draft set.

fidelity:
  divergences: >-
    Encoding choices, ambiguities and suspected source issues are recorded in
    the module that meets them; no manuscript deviation is absorbed silently.

review:
  status: "in-progress"
  reviewers:
    - "Ahmed Bou-Rabee"
    - "Yuval Peres"
  notes: >-
    All 76 manifest nodes are proved with the standard Mathlib axiom surface,
    no node is registered as a draft, and the chain from the frequency estimate
    to the main theorems is closed.

