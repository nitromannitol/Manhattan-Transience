version: "v0.4"

project:
  name: "manhattan-formalization"
  description: >-
    A Lean 4 / Mathlib formalization of the paper "The randomly oriented
    Manhattan lattice in 2D is transient" (Bou-Rabee and Peres): for almost
    every environment of independent fair-coin orientations of the lines of
    Z^2, the quenched Green series of the walk is finite at every site
    (Theorem 1.1), deduced from a uniform bound on the Laplace transforms of
    the annealed return probability of the continuous-time walk (Theorem 1.2).
    The formalization also proves the statements the argument passes through
    (the generator and Green decomposition in Fourier-Walsh coordinates, the
    variational upper bound, the fixed-frequency estimate, and the degree-one
    and degree-three estimates) and proves Theorem 1.1 a second time along the
    shorter argument of the arXiv version.  Both main theorems are
    independently checked by Mathlib-only comparator challenges under Audit/.
  authors:
    - "Ahmed Bou-Rabee"
  license: "Apache-2.0"

sources:
  - title: "The randomly oriented Manhattan lattice in 2D is transient"
    authors:
      - "Ahmed Bou-Rabee"
      - "Yuval Peres"
    id: "arXiv:2609.07621"
    url: "https://arxiv.org/abs/2609.07621"
    type: "manuscript"
    relationship: "formalizes"
    note: >-
      The paper under formalization.  Theorems 1.1 and 1.2 are both proved.  The
      statements are pinned to paper/manuscript.tex, which differs from the
      arXiv version; see fidelity.divergences and paper/CHANGES_FROM_ARXIV.md.
    license: "all rights reserved"
    author_contacted: "n/a"     # the formalizer is an author of the source
    prior_work: ""

related_formalizations:
  - id: "https://github.com/nitromannitol/Lattice-Probability"
    relationship: "builds-on"
    note: >-
      Shared library of the results that do not depend on the Manhattan model
      (the semigroup of a bounded generator and its Laplace resolvent, the
      dissipative-skew pair and its coercive resolvents, Polya's theorem in two
      dimensions, the Nash inequality on Z^2 and the rate-two Poisson clock);
      a pinned git dependency at commit
      bbe0b90a7cf0517db0578139aaab7f152edbc45e.

status:
  scope: >-
    A Lean 4 / Mathlib formalization of both main theorems of the paper:
    almost-sure transience of the randomly oriented Manhattan lattice, stated
    as finiteness of the quenched Green series at every site (Theorem 1.1),
    and the uniform bound on the Laplace transforms of the annealed
    continuous-time return probability with finiteness of the annealed Green
    function (Theorem 1.2).  The frozen-statement manifest registers 76
    statements of the pinned manuscript paper/manuscript.tex, all PROVED: the
    model and its kernels, the countable Fourier-Walsh coordinates, the Fourier
    transform in position and Proposition 2.1, the variational upper bound
    (formula (15)), the fixed-frequency estimate (Proposition 2.2), the
    degree-one and degree-three estimates (Lemma 4.1, Proposition 4.2), and
    the Fourier-Walsh calculations of Section 5 at the concrete competitor.
    Theorem 1.1 is also proved along the shorter argument of the arXiv version
    (Manhattan/V4/).  No result from the literature is assumed.  Not
    formalized: the open questions, the figures and the discussion of related
    work.  The main theorems are stated in full in
    Manhattan/MainTheorems.lean; both are additionally restated over a
    Mathlib-only vocabulary for the Lean comparator (Audit/).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - declaration: "Manhattan.transience"
      file: "Manhattan/MainTheorems.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "Audit/Transience/comparator.json"
      literature_dependencies: []
    - declaration: "Manhattan.annealed_green_bound"
      file: "Manhattan/MainTheorems.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "Audit/AnnealedGreenBound/comparator.json"
      literature_dependencies: []
    - declaration: "ManhattanAudit.transience"
      file: "Audit/Transience/Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "Audit/Transience/comparator.json"
      literature_dependencies: []
    - declaration: "ManhattanAudit.annealed_green_bound"
      file: "Audit/AnnealedGreenBound/Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "Audit/AnnealedGreenBound/comparator.json"
      literature_dependencies: []

automation:
  methods:
    - method: "agent"
      models:
        - "gpt-5.6-sol"
        - "claude-fable-5-1"
        - "claude-opus-5"
        - "claude-haiku-4-5"
        - "glm-5.3"
        - "claude-opus-5-5"
      framework: >-
        Codex CLI (OpenAI) for gpt-5.6-sol; Claude Code (Anthropic) for the
        Claude models, including work delegated to Claude Code workers; a
        scripted API call for glm-5.3
      tool_setup: >-
        Lake builds under leanprover/lean4:v4.32.0 with Mathlib at revision
        81a5d257c8e410db227a6665ed08f64fea08e997 and the shared library
        Lattice-Probability at commit bbe0b90, which carries the general results
        that do not depend on the Manhattan model.  A frozen-statement manifest
        (ledger/manifest.yaml) pins each registered statement by the SHA-256
        of its text and its dependency closure, and the tools/ checkers verify
        the hashes, a sorry-free and warning-free build and the Mathlib
        environment linters; Manhattan/Meta/AxiomsAudit.lean prints the axiom
        closure of every proved node.  The Lean comparator
        (leanprover/comparator) accepts both Audit pairs with the Lean kernel
        and with the independent nanoda kernel; results and reproduction steps
        are in Audit/COMPARATOR_RUNS.md.  .github/workflows/comparator.yml runs
        it on request.
      cost:
        wall_time: >-
          about five days of calendar time for the proofs; one further day for
          the release documentation and the comparator surface, and one for the
          port to Lean v4.32.0
        spend_usd: "not tracked (subscription and API accounts)"
        hardware: "a 20-thread Intel i9-9900X / 125 GB RAM Ubuntu machine"
      prompting_notes: >-
        Human-directed agent work, supervised by the author, who decided every
        statement-level question.  Every statement was pinned before its proof
        was attempted, and proofs were accepted only through the manifest,
        warning and axiom gates.
  spend_usd: "not tracked (subscription and API accounts)"
  notes: >-
    All Lean code in this repository was written by the listed models under the
    supervision of the author.  Every proof is checked by the Lean kernel and
    Mathlib; the verified library contains no sorry and no custom axiom, and no
    result from the literature enters as a hypothesis.  The Mathlib-only
    comparator challenge files (Audit/*/Challenge.lean) each contain exactly
    one intentional statement-level sorry (the theorem body), which is filled
    by the corresponding Audit/*/Solution.lean.

fidelity:
  divergences: >-
    The pinned manuscript paper/manuscript.tex states what the Lean statements
    state, and paper/CHANGES_FROM_ARXIV.md records every difference between it
    and arXiv:2609.07621v1, whose unmodified source is paper/arxiv/.
    Rendering conventions (not divergences): an environment is indexed by the
    lines of Z^2 (axis and transverse coordinate) rather than by the paper's
    redundant omega(z, i); the quenched n-step kernel is the path count 2^-n
    times the number of axis words from z to z'; the continuous-time kernel is
    defined by rate-two Poisson subordination of the discrete kernel;
    finiteness is stated in the extended nonnegative reals.  Formula (15) is
    formalized in its upper-bound direction only, and Lemma 5.3 on its raw
    frequency side only.  The manifest is pinned to paper/manuscript.tex, which
    differs from the arXiv version; the arXiv version reaches Theorem 1.1 by a
    shorter argument, which is formalized separately in Manhattan/V4/, and
    CORRESPONDENCE.md records which frozen statements it does not print.  The
    numerical constants 2048 (Theorem 1.2, Proposition 6.1) and 16 (Lemma 5.1)
    stated in the arXiv version are not certified; the formal statements are
    existential in the constant.

review:
  status: "author-verified"
  reviewers:
    - "Ahmed Bou-Rabee"
  notes: >-
    Correctness of every proof is guaranteed by the Lean kernel and Mathlib (no
    sorry, no custom axiom).  The author ruled on the statement-level
    decisions.  A second, independent reading of the frozen statements is
    recorded for part of the frozen surface; it is not recorded for the twelve
    concrete-lemma anchors under Manhattan/Frozen/Glue/ or for the cone of the
    main theorems.  The statements of the two main theorems are checked
    independently by the comparator challenges under Audit/.  This is not
    external peer review.

alignment:
  namespace: "Manhattan"
  statements:
    - source: "Theorem 1.1 (thm:main)"
      lean: "Manhattan.transience"
      module: "Manhattan.MainTheorems"
      status: "proved"
      note: "Certified statement Manhattan.Frozen.Main.theorem_1_1. Comparator challenge Audit/Transience/."
    - source: "Theorem 1.2 (thm:annealed)"
      lean: "Manhattan.annealed_green_bound"
      module: "Manhattan.MainTheorems"
      status: "proved"
      note: "Certified statement Manhattan.Frozen.Main.theorem_1_2 (Manhattan.AnnealedGreenBound). Comparator challenge Audit/AnnealedGreenBound/."
    - source: "Proposition 2.1 (prop:generator)"
      lean: "Manhattan.Frozen.Operator.proposition_generator_v2"
      module: "Manhattan.Frozen.Operator.PropositionGeneratorV2"
      status: "proved"
      note: "Pointwise frequency generator and Green decomposition."
    - source: "Formula (15), upper-bound direction (var-ineq)"
      lean: "Manhattan.Frozen.Operator.resolventQuadratic_le"
      module: "Manhattan.Frozen.Operator.ResolventQuadraticLe"
      status: "proved"
      note: "Upper-bound direction only."
    - source: "Proposition 2.2 (prop:frequency)"
      lean: "Manhattan.Frozen.Estimates.proposition_frequency"
      module: "Manhattan.Frozen.Estimates.PropositionFrequency"
      status: "proved"
      note: "Torus-restricted statement; proved by Manhattan.Glue.proposition_frequency_v2."
    - source: "Lemma 4.1 (lem:onecoin)"
      lean: "Manhattan.Frozen.Estimates.lemma_one_coin_v3"
      module: "Manhattan.Frozen.Estimates.LemmaOneCoinV3"
      status: "proved"
      note: "Includes explicit integral-finiteness certificates."
    - source: "Proposition 4.2 (prop:key)"
      lean: "Manhattan.Frozen.Estimates.proposition_key"
      module: "Manhattan.Frozen.Estimates.PropositionKey"
      status: "proved"
      note: "Scalar degree-three correction estimate."
    - source: "Sections 4 and 5 at the concrete competitor: (Hsym), Lemmas 5.1 to 5.4, the four summands of (22) and the sector energy bound"
      lean: "Manhattan.Frozen.Glue.*"
      module: "Manhattan.Frozen.Glue"
      status: "proved"
      note: "One registered statement per anchor; the full map is CORRESPONDENCE.md."
    - source: "Theorem 1.1 along the arXiv version"
      lean: "Manhattan.V4.theorem_1_1_v4"
      module: "Manhattan.V4"
      status: "proved"
      note: "Second proof of Theorem 1.1; not a manifest node."

acknowledgements: >-
  The paper is joint work with Yuval Peres.  Built on Lean 4, Mathlib, Lake and
  leanprover/comparator.
