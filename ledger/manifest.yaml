# Manhattan frozen-statement manifest.
#
# This is the single source of truth for the certified public statement
# surface. There is one entry per frozen declaration, and every Lean file under
# Manhattan/Frozen/ must have exactly one owner. Run
# `python3 tools/check_manifest.py` before every landing.
#
# Fields:
#   id               stable node id (normally a paper label)
#   version          integer, bumped only by an approved successor
#   kind             theorem | definition
#   source           pinned manuscript.tex line range plus ruling ids
#   file             repository-relative path of the single frozen file
#   export           fully qualified Lean name of the frozen declaration
#   state            DRAFT_SORRY | PROVED | SEALED
#                    for theorems; FROZEN for definitions
#   superseded_by    optional approved successor id; the predecessor remains
#                    historical and is excluded from the headline imports
#   frozen_sha256    SHA-256 of the exact bytes between the frozen markers
#   closure_sha256   optional SHA-256 of the explicit local support closure
#   provider         sealed provider export, or intended provider for a draft
#   draft_allowlist  consumers allowed while the provider is unsealed
#   approved         date the exact declaration bytes were approved
#
# Invariants checked by tools/check_manifest.py:
#   - exactly one frozen block and declaration per owned file;
#   - exact frozen-byte and present closure hashes;
#   - `sorry` only as the one post-marker proof body of a registered draft
#     theorem, never in a definition or proved support;
#   - no custom `axiom`, `admit`, or explicit `sorryAx` in Manhattan/;
#   - every Manhattan/Frozen/ file has exactly one manifest owner.

